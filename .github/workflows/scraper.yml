name: Escaneo Flashscore Async

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar librerías de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Chromium y dependencias del sistema
        run: |
          playwright install chromium --with-deps

      # --- NUEVO: Conservar el archivo de memoria entre ejecuciones ---
      - name: Restaurar historial de partidos alertados
        uses: actions/cache@v4
        with:
          path: alertados.txt
          key: alertados-${{ github.run_id }}
          restore-keys: |
            alertados-

      - name: Ejecutar script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python app.py
